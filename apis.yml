aid: apptopia
name: Apptopia
description: >-
  Apptopia is a mobile app market-intelligence company that delivers
  investor-grade estimates of app downloads, revenue, usage, ratings, SDK
  adoption, and advertising activity across the iTunes App Store, Google Play,
  Tencent, Xiaomi, and Mobile 360 stores. Its data is derived from a real-user
  device panel and is trusted by financial institutions, ad-tech firms, and app
  publishers to track competitors, size markets, and validate investment theses.
  The Apptopia Data API exposes the raw dataset behind these estimates as JSON
  over HTTPS, organized into directory, discovery, time-series, entity-lookup,
  search, and data-export endpoints, authenticated with JSON Web Tokens.
